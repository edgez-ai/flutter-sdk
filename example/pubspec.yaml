name: edgez_flutter_sdk_example
description: EdgeZ Flutter SDK example app with offline Organic Maps support.
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  app_links: 6.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_gemma: ^1.5.5
  flutter_gemma_litertlm: ^1.3.1
  http: ^1.6.0
  intl: any
  edgez_flutter_sdk:
    path: ..
  shared_preferences: ^2.5.3
  sqflite: ^2.4.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/drivers/random-temperature/
    - assets/i18n/
