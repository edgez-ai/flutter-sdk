name: edgez_flutter_sdk
description: Android Flutter SDK for EdgeZ HaLow mesh devices, BLE transport, encrypted messaging, voice calls, provisioning, and OTA updates.
version: 0.1.6
homepage: https://www.edgez.ai
repository: https://github.com/edgez-ai/flutter-sdk
issue_tracker: https://github.com/edgez-ai/flutter-sdk/issues
topics:
  - bluetooth
  - ble
  - mesh
  - halow
  - iot

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

flutter:
  plugin:
    platforms:
      android:
        package: ai.edgez.flutter_sdk
        pluginClass: EdgezFlutterSdkPlugin

dependencies:
  cryptography: ^2.7.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  protobuf: ^5.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  protoc_plugin: ^23.0.0
