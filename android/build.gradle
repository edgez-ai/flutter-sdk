group = 'ai.edgez.flutter_sdk'
version = '0.1.0'

buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        ivy {
            url 'https://github.com/edgez-ai/organicmaps/releases/download/v0.0.4'
            patternLayout {
                artifact '[artifact]-[revision].[ext]'
            }
            metadataSources {
                artifact()
            }
            content {
                includeGroup 'ai.edgez.organicmaps'
            }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def hostAndroid = rootProject.findProject(':app')?.extensions?.findByName('android')
def hostCompileSdkVersion = hostAndroid?.compileSdk
def edgezCompileSdkVersion = (
    findProperty('edgez.compileSdkVersion') ?: hostCompileSdkVersion ?: 36
) as int
if (edgezCompileSdkVersion < 34) {
    throw new GradleException(
        "edgez.compileSdkVersion must be at least 34 (was ${edgezCompileSdkVersion})"
    )
}

android {
    namespace 'ai.edgez.flutter_sdk'
    compileSdk edgezCompileSdkVersion

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation 'androidx.media:media:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.protobuf:protobuf-javalite:4.33.2'
    implementation 'com.github.mik3y:usb-serial-for-android:3.10.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'ai.edgez.organicmaps:organicmaps-location-core:0.0.4@aar'
    implementation 'ai.edgez.organicmaps:organicmaps-maps-world:0.0.4@aar'
    implementation 'ai.edgez.organicmaps:organicmaps-sdk:0.0.4@aar'
}
